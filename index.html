<!DOCTYPE html>
<html>
<head>
    <title>Stream Preview</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        iframe { width: 90%; height: 90%; border: 2px solid #555; }
    </style>
</head>
<body>
    <script>
    // 1. Set your secret password here
    var secretCode = "cairo2026"; 

    // 2. Ask the user for the code
    var userEntry = prompt("This is a private stream. Enter Access Code:");

    // 3. Logic check
    if (userEntry !== secretCode) {
        alert("Incorrect password. Access denied.");
        window.location.href = "https://google.com"; // Kick them out
        throw new Error("Access Denied"); // Stop the iframe from loading
    }
</script>
    <iframe 
        src="https://vdo.ninja/?view=ripevw_live&autoplay=1" 
        allow="autoplay; camera; microphone; fullscreen">
    </iframe>
</body>
</html>
